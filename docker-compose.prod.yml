# 원격지(운영) 배포 오버레이 — design 01 §6.1 초기 토폴로지의 prod 실행 형태.
# 사용: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prototype --env-file .env up -d
#
# base(docker-compose.yml) 대비 차이:
# - 인프라 스토어(pg/minio/neo4j/opensearch)의 호스트 publish 를 완전 제거 (!override []).
#   컨테이너 간 통신은 compose 브리지 DNS(service name)로 충분 — 호스트 포트 바인딩은
#   OrbStack 포트 포워더의 간헐적 EADDRINUSE race 의 원인이며 외부 노출 표면이기도 하다.
#   접근이 필요하면 `docker compose exec` 또는 orb SSH 로.
# - viewer: 애플리케이션 프로세스 (compose `prototype` 서비스 재사용).
# - scheduler: APScheduler 상주 dispatch (§6.2 단일 발화 주체 — prod 에선 이 컨테이너 하나).
# - 커넥터 환경변수는 컨테이너 DNS 주입 (code default 는 localhost — 로컬 네이티브 개발 유지).
# - data 는 named volume (orc-citadel-proddata, 정적 이름) — 배포 코드 갱신과
#   무관하게 원본 데이터 보존, compose project 이동에도 유지.

services:
  postgres:
    ports: !override []

  minio:
    ports: !override []

  neo4j:
    ports: !override []

  opensearch:
    ports: !override []

  grafana:
    # loopback 바인딩은 base 상속 (127.0.0.1:3000) — SSH 터널로 접근.
    restart: unless-stopped

  duckdb-ui:
    # loopback 바인딩은 base 상속 (127.0.0.1:4213) — SSH 터널로 접근.
    # proddata 의 parquet subpath 만 read-only — .duckdb 는 볼 수 없다.
    # 전제: 첫 스냅샷(스케줄러 런 또는 수동 1회)이 parquet/ 를 만든 뒤 기동.
    restart: unless-stopped
    volumes: !override
      - type: volume
        source: proddata
        target: /data/parquet
        read_only: true
        volume:
          subpath: parquet

  prototype:
    # viewer — prod 포트 바인딩도 loopback 기본. 외부 공개는 VIEWER_BIND=0.0.0.0
    image: orc-citadel-prototype:latest
    ports:
      - "${VIEWER_BIND:-127.0.0.1}:8791:8791"
    volumes:
      - proddata:/app/data
      # base 와 동일 — rsync 가 docs/·design-system/ 을 원격에 보내므로 그대로 물린다.
      - ./docs/mockups/assets:/app/static/img:ro
      - ./design-system/theme-citadel/dist/theme.css:/app/static/theme-citadel.css:ro
      - ./design-system/fonts/dist:/app/static/fonts:ro
      # 8공간 라우트의 유일한 표시 계층 — 없으면 viewer 가 정직 503 (dist 는 커밋 대상).
      - ./frontend/dist:/app/static/app-dist:ro
    environment:
      VIEWER_HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      MINIO_HOST: minio
      NEO4J_URI: bolt://neo4j:7687
      # 자격증명 — 호스트 DNS 만 주입하면 클라이언트가 로컬 개발 기본값으로
      # 폴백해 조용히 인증 실패한다 (2026-09-10 prod 실측: run_metrics flush
      # 상시 실패 → 메트릭 테이블 미생성). 값의 SoT 는 원격 .env.
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    # nightly dispatch 상주 프로세스 (07:07 수집 / 07:37 SLO-06).
    # viewer 와 동일 image 태그 — build 재실행은 layer cache 로 사실상 무비용.
    build: ./prototype
    image: orc-citadel-prototype:latest
    command: ["python", "scripts/scheduler_runner.py"]
    working_dir: /app
    volumes:
      - proddata:/app/data
      # base 와 동일 — rsync 가 docs/·design-system/ 을 원격에 보내므로 그대로 물린다.
      - ./docs/mockups/assets:/app/static/img:ro
      - ./design-system/theme-citadel/dist/theme.css:/app/static/theme-citadel.css:ro
      - ./design-system/fonts/dist:/app/static/fonts:ro
    environment:
      # nightly 발화 시각(07:07/07:37)은 운영 타임존 기준 — 컨테이너 기본 UTC 봉인.
      TZ: ${TZ:-Asia/Seoul}
      # nightly_slo06._load_env() 은 repo-root .env 를 읽으려 하나 컨테이너엔 없음 →
      # compose 환경 주입이 사실상 경로. setdefault 는 이미 있는 키를 건드리지 않는다.
      POSTGRES_HOST: postgres
      MINIO_HOST: minio
      NEO4J_URI: bolt://neo4j:7687
      # 자격증명 — prototype 과 동일 사유 (자격증명 없으면 로컬 기본값 폴백 →
      # prod postgres 인증 실패, flush 조용한 실패). 값의 SoT 는 원격 .env.
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # 판정 completion 예산 (A30) — reasoning 모델은 reasoning 토큰을 여기서
      # 소비. glm-4.7-flash 실측: 2048 도 잘림(평균 2031/30건 pass 2) → 8192 권장.
      # 예산은 상한일 뿐 과금은 실사용 토큰 기준.
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
    depends_on:
      prototype:
        condition: service_started
    restart: unless-stopped

volumes:
  proddata:
    name: orc-citadel-proddata
