# design 01 §6.1 배포 토폴로지 (Docker Compose, 단일 호스트) — 부분 구현.
# api/worker는 FastAPI 코드 확보 후 추가한다.
# 크리덴셜은 .env 에서 주입한다 (.env.example 참고).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.9
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092 --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redpanda-init:
    profiles: ["prototype"]
    build: ./prototype
    command: ["python", "-m", "orc_citadel.event_stream", "bootstrap"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10


  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.4
    command: ["serve"]
    environment:
      LAKEKEEPER__PG_HOST_R: postgres
      LAKEKEEPER__PG_HOST_W: postgres
      LAKEKEEPER__PG_PORT: "5432"
      LAKEKEEPER__PG_USER: ${POSTGRES_USER:?}
      LAKEKEEPER__PG_PASSWORD: ${POSTGRES_PASSWORD:?}
      LAKEKEEPER__PG_DATABASE: ${POSTGRES_DB:?}
      LAKEKEEPER__PG_SSL_MODE: disable
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:?}
      LAKEKEEPER__AUTHZ_BACKEND: allowall
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"        # 로컬 단일 호스트 전용
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 파이프라인 모니터링 사이드카 (specs/ui-overhaul-astryx TS-6, design 11 §2.2).
  # - 관측 전용: postgres 는 read-only 계정(grafana_reader)으로만 접속 —
  #   deploy/grafana/init-readonly.sql 을 1회 적용해야 datasource 가 살아난다.
  # - 접근 정책은 viewer 와 동일: loopback + SSH 터널. 익명은 Viewer(읽기)만,
  #   편집은 admin 로그인(GRAFANA_ADMIN_PASSWORD).
  # - 대시보드·datasource 는 provisioning as code — UI 편집은 영속되지 않는다.
  grafana:
    image: grafana/grafana-oss:11.5.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      # 오프라인 런타임 유지 — 원격 콜아웃 차단 (외부 CDN 금지 규약과 동일 방향).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # provisioning yaml 이 grafana 의 env 보간으로 소비한다.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres:
        condition: service_healthy

  # 데이터 존 브라우징 사이드카 (specs/ui-overhaul-astryx TS-7, Step 16b).
  # - parquet 스냅샷(16a)만 read-only 로 읽는다 — 존 `.duckdb` 는 마운트하지
  #   않는다 (뷰어 RW 잠금 함정 원천 차단, §3-3 존 오염 불가).
  # - 접근 정책은 viewer·grafana 와 동일: loopback + SSH 터널.
  duckdb-ui:
    build: ./deploy/duckdb-ui
    ports:
      - "127.0.0.1:4213:4213"
    volumes:
      - ./prototype/data/parquet:/data/parquet:ro

  # 선택 실행: docker compose --profile prototype up -d --build
  # 호스트 publish는 docker-compose.prod.yml 가 소유 — 이중 바인딩은
  # OrbStack 포트 포워더를 교착시킨다 (0.0.0.0 + 127.0.0.1 병존 시 dead 포트).
  # 로컬 실행은 http://localhost:8791 대신 컨테이너 IP 로 접속하거나 prod 오버레이 사용.
  prototype:
    profiles: ["prototype"]
    build: ./prototype
    environment:
      VIEWER_HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:?}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:?}
      LAKEKEEPER_WAREHOUSE_BUCKET: ${LAKEKEEPER_WAREHOUSE_BUCKET:?}
      ICEBERG_S3_ENDPOINT: ${ICEBERG_S3_ENDPOINT:?}
      ICEBERG_S3_REGION: ${ICEBERG_S3_REGION:?}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    volumes:
      - ./prototype/data:/app/data
      - ./deploy/lakekeeper:/app/deploy/lakekeeper:ro
      # 정적 자산 — 이미지에는 prototype/ 만 들어간다. 히어로 PNG 19MB 를
      # 이미지에 굽지 않으려고 원본을 read-only 로 물린다 (viewer_static.py).
      - ./docs/mockups/assets:/app/static/img:ro
      - ./docs/mockups/astryx.css:/app/static/astryx.css:ro
      - ./docs/mockups/reset.css:/app/static/reset.css:ro
      - ./design-system/theme-citadel/dist/theme.css:/app/static/theme-citadel.css:ro
      - ./design-system/fonts/dist:/app/static/fonts:ro
      # 8공간 라우트의 유일한 표시 계층 — 없으면 viewer 가 정직 503 (dist 는 커밋 대상).
      - ./frontend/dist:/app/static/app-dist:ro

  promotion-consumer:
    profiles: ["prototype"]
    build: ./prototype
    command: ["python", "-m", "orc_citadel.promotion_consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:?}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:?}
      LAKEKEEPER_WAREHOUSE_BUCKET: ${LAKEKEEPER_WAREHOUSE_BUCKET:?}
      ICEBERG_S3_ENDPOINT: ${ICEBERG_S3_ENDPOINT:?}
      ICEBERG_S3_REGION: ${ICEBERG_S3_REGION:?}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    depends_on:
      minio:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    volumes:
      - ./prototype/data:/app/data
      - ./deploy/lakekeeper:/app/deploy/lakekeeper:ro
    restart: unless-stopped

  investigation-worker:
    profiles: ["prototype"]
    build: ./prototype
    command: ["python", "scripts/investigation_worker.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./prototype/data:/app/data
volumes:
  pgdata:
  minio-data:
  neo4j-data:
  opensearch-data:
  redpanda-data:
  grafana-data:
