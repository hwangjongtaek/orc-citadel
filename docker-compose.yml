# design 01 §6.1 배포 토폴로지 (Docker Compose, 단일 호스트) — 부분 구현.
# api/worker는 FastAPI 코드 확보 후 추가한다.
# 크리덴셜은 .env 에서 주입한다 (.env.example 참고).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"        # 로컬 단일 호스트 전용
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 파이프라인 모니터링 사이드카 (specs/ui-overhaul-astryx TS-6, design 11 §2.2).
  # - 관측 전용: postgres 는 read-only 계정(grafana_reader)으로만 접속 —
  #   deploy/grafana/init-readonly.sql 을 1회 적용해야 datasource 가 살아난다.
  # - 접근 정책은 viewer 와 동일: loopback + SSH 터널. 익명은 Viewer(읽기)만,
  #   편집은 admin 로그인(GRAFANA_ADMIN_PASSWORD).
  # - 대시보드·datasource 는 provisioning as code — UI 편집은 영속되지 않는다.
  grafana:
    image: grafana/grafana-oss:11.5.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      # 오프라인 런타임 유지 — 원격 콜아웃 차단 (외부 CDN 금지 규약과 동일 방향).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # provisioning yaml 이 grafana 의 env 보간으로 소비한다.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres:
        condition: service_healthy

  # 데이터 존 브라우징 사이드카 (specs/ui-overhaul-astryx TS-7, Step 16b).
  # - parquet 스냅샷(16a)만 read-only 로 읽는다 — 존 `.duckdb` 는 마운트하지
  #   않는다 (뷰어 RW 잠금 함정 원천 차단, §3-3 존 오염 불가).
  # - 접근 정책은 viewer·grafana 와 동일: loopback + SSH 터널.
  duckdb-ui:
    build: ./deploy/duckdb-ui
    ports:
      - "127.0.0.1:4213:4213"
    volumes:
      - ./prototype/data/parquet:/data/parquet:ro

  # 선택 실행: docker compose --profile prototype up -d --build
  # 호스트 publish는 docker-compose.prod.yml 가 소유 — 이중 바인딩은
  # OrbStack 포트 포워더를 교착시킨다 (0.0.0.0 + 127.0.0.1 병존 시 dead 포트).
  # 로컬 실행은 http://localhost:8791 대신 컨테이너 IP 로 접속하거나 prod 오버레이 사용.
  prototype:
    profiles: ["prototype"]
    build: ./prototype
    environment:
      VIEWER_HOST: 0.0.0.0
    volumes:
      - ./prototype/data:/app/data
      # 정적 자산 — 이미지에는 prototype/ 만 들어간다. 히어로 PNG 19MB 를
      # 이미지에 굽지 않으려고 원본을 read-only 로 물린다 (viewer_static.py).
      - ./docs/mockups/assets:/app/static/img:ro
      - ./design-system/theme-citadel/dist/theme.css:/app/static/theme-citadel.css:ro
      - ./design-system/fonts/dist:/app/static/fonts:ro
volumes:
  pgdata:
  minio-data:
  neo4j-data:
  opensearch-data:
  grafana-data:
