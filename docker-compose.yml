# design 01 §6.1 배포 토폴로지 (Docker Compose, 단일 호스트) — 부분 구현.
# api/worker는 FastAPI 코드 확보 후, grafana는 메트릭 소스 확보 후 추가한다.
# 크리덴셜은 .env 에서 주입한다 (.env.example 참고).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"        # 로컬 단일 호스트 전용
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 선택 실행: docker compose --profile prototype up -d --build
  # 호스트 publish는 docker-compose.prod.yml 가 소유 — 이중 바인딩은
  # OrbStack 포트 포워더를 교착시킨다 (0.0.0.0 + 127.0.0.1 병존 시 dead 포트).
  # 로컬 실행은 http://localhost:8791 대신 컨테이너 IP 로 접속하거나 prod 오버레이 사용.
  prototype:
    profiles: ["prototype"]
    build: ./prototype
    environment:
      VIEWER_HOST: 0.0.0.0
    volumes:
      - ./prototype/data:/app/data
volumes:
  pgdata:
  minio-data:
  neo4j-data:
  opensearch-data:
