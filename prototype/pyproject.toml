[project]
name = "orc-citadel-prototype"
version = "0.1.0"
description = "Orc Citadel provenance & idempotency model prototype (Phase 0, design 03)"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "minio>=7.2.20",
    "neo4j>=6.2.0",
    "psycopg[binary]>=3.3.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
