# Grafana datasource as code (TS-6) — 파이프라인 메트릭 postgres.
# 크리덴셜은 커밋하지 않는다 — $VAR 는 grafana 컨테이너 env 에서 보간된다
# (compose 가 GRAFANA_DB_PASSWORD·POSTGRES_DB 를 주입).
# 계정은 read-only grafana_reader — deploy/grafana/init-readonly.sql 1회 적용.
apiVersion: 1

datasources:
  - name: Citadel Postgres
    uid: citadel-pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    editable: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 4
      timescaledb: false
